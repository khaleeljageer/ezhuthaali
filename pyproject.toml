[project]
name = "thattan"
version = "0.1.0"
description = "Tamil99 typing practice application"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501", # line length handled by formatter / long Tamil string literals
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]

[tool.mypy]
python_version = "3.11"
# Scoped to core/: PySide6's stubs don't declare the Qt.AlignCenter-style enum
# shortcuts used throughout ui/, which drowns real findings in stub-gap noise.
packages = ["thattan.core"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
